# Book 1, Chapter 8: the last bandage, and the summons (story mode, design §10.4).
# DRAFT for the author's review. Novel ¶281-293; breakdown chapter 8; comic b1-p013.
# The room: the comic ends with Dvij walking out "through the open door into the bright garden"
# while "the Professor sits at his desk" (b1-p013-9), so it is the study; where in it he sits is ours.

scene: b1-ch08
book: 1
pages: [13]
title: Chapter 8
novel: [281, 293]
start:
  pose: sit-low                                  # on a stool, while Bhavi works on his forehead (breakdown ch8 p1)
  at: [-8.8, -13.2]
  look: [-10.0, 1.55, -13.2]
cast:
  - {who: bhavi, at: [-9.7, -13.2], pose: stand, sources: [breakdown ch8 p1, comic b1-p013-1]}
  - {who: professor, at: [-12.4, -12.0], pose: sit, on: desk, sources: [comic b1-p013-1, comic b1-p013-9]}
props:
  - {id: stool, kind: stool, at: [-8.8, -13.2], sources: [ours]}
  - {id: study-clutter, kind: clutter, room: study, sources: [novel ¶100]}

beats:
  - id: the-tape
    sources: [breakdown ch8 p1, comic b1-p013-1, novel ¶281, novel ¶282]
    do:
      - say: {who: bhavi, line: "Stop moving! Don't fidget like a baby!", sources: [novel ¶281]}
      - sound: hiss                              # the tape yanked off (breakdown ch8 p1: "RIP!")
      - effect: {flash: 0.35, blur: 0.4}
      - effect: {blur: 0, over: 2.5}
      - caption: "Dvij winced as Bhavi yanked the medical tape off his forehead. The gauze was coated with a strip of dry blood. He felt a solitary drop run down the side of his face."

  - id: the-wound
    sources: [breakdown ch8 p2, comic b1-p013-2, novel ¶283]
    act:
      objective: Hold still.
      kind: press
    then:
      - say: {who: bhavi, line: "Does it hurt? It does? Good. It might force you to remember things. The gash is still open but it's getting better. The skin is pink around the wound. That means it is healing.", sources: [novel ¶283]}
      - say: {who: bhavi, line: "That also means you will have the constant urge to itch... don't do that unless you want me to reopen your skull. We'll just swab it with a cotton ball soaked in crystal violet... and put a plaster on it... There.", sources: [novel ¶283]}

  - id: the-arm
    sources: [breakdown ch8 p3, novel ¶283]
    do:
      - say: {who: bhavi, line: "Hmm... too bad the scar will remain. Now your arm. Move it up.", sources: [novel ¶283]}
    act:
      objective: Move your arm up.
      kind: press
    then:
      - look: {at: arm}
      - say: {who: bhavi, line: "Does it hurt there? No? Good. You can take off the cast. Or keep it on for a few more days. It will go well with that wounded image you are supposed to carry.", sources: [novel ¶283]}
      - checkpoint: plaster

  - id: the-gong
    sources: [breakdown ch8 p4, breakdown ch8 p5, comic b1-p013-3, comic b1-p013-5, novel ¶284-286]
    do:
      - sound: gong
      - caption: "A gong rang loud somewhere in the lodge."
      - say: {who: professor, line: "Will you stop bickering with your only patient and answer the door?", sources: [novel ¶284]}
      - actor: {who: bhavi, walk: [-7.75, -9.5], exit: true}   # out through the study door, in a huff (novel ¶285)
      - caption: "Bhavi left the room in a huff."
      - say: {who: professor, line: "She's a firebrand, my niece. She is bored of living with me, but naturally. She finds nothing meaningful to do around here, so she keeps wandering about the hills and the forests. The wild berries have poisoned her tongue.", sources: [novel ¶286]}
      - wait: 2

  - id: the-summons
    sources: [breakdown ch8 p6, breakdown ch8 p7, comic b1-p013-6, comic b1-p013-7, novel ¶287-289]
    do:
      - actor: {who: bhavi, walk: [-9.7, -13.2], from: [-7.75, -9.5]}
      - caption: "Bhavi was back, and her huffing, if anything, was more than before."
      - say: {who: bhavi, line: "Talk of the devil... it's the Mahant's henchman. He wants the Wounded One to attend some ceremony at the main temple. Today! Would you believe that? I guess word must have travelled around that the Wounded One is Wounded No More.", sources: [novel ¶288]}
      - say: {who: professor, line: "I wonder how?", sources: [novel ¶289]}

  - id: the-cowherd
    sources: [breakdown ch8 p7, breakdown ch8 p8, comic b1-p013-8, novel ¶290-292]
    act:
      objective: Tell them how.
      kind: press
    then:
      - say: {who: dvij, line: "It's the cowherd who gets the milk. He finds out what's happening at the lodge and spreads the word around.", sources: [novel ¶290]}
      - caption: "The Professor and his niece looked at Dvij with their eyes wide with surprise, expecting him to explain how he knew that."
      - say: {who: dvij, line: "Am I not supposed to know everything? I am the Wounded One after all.", sources: [novel ¶292]}
      - camera: {pose: stand, over: 1.2}
      - checkpoint: summoned

  - id: the-henchman
    sources: [breakdown ch8 p9, comic b1-p013-9, novel ¶293]
    act:
      objective: Go out to meet the Mahant's henchman.
      kind: reach
      target: [0, 20.4]                          # out of the front door, onto the doorsteps (as in Chapter 4)
      radius: 1.5
    then:
      - caption: "Dvij went on smiling as he walked out to meet the Mahant's henchman, leaving behind the Professor deep in thought and Bhavi bitterly chewing her lips."
      - progress: {book: 1, page: 13}
      - end: {next: null}
