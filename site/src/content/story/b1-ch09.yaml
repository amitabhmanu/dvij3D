# Book 1, Chapter 9: Mahant's tent, the paan, the name, and the fire (story mode, design §10.4).
# DRAFT for the author's review. Novel ¶294-324; breakdown chapter 9; comic b1-p014, b1-p015.
# Played at the temple site (src/content/valley/temple-site.yaml), in its frame: metres, x east,
# z south, origin at the middle of the tent's floor, its entrance facing south.

scene: b1-ch09
book: 1
pages: [14, 15]
title: Chapter 9
novel: [294, 324]
frame: temple-site
setting:                                         # "It was mid-day" (novel ¶296)
  sun: midday
start:
  pose: stand                                    # kept standing before the divan (novel ¶298)
  at: [0.2, 0.9]
  look: [1.3, 0.9, -2.3]
cast:
  - {who: mahant, at: [1.4, -2.0], pose: recline, on: divan, face: player, sources: [novel ¶296, comic b1-p014-1]}
  - {who: baldev, at: [-2.6, -0.9], pose: sit, on: chair, face: [0.2, -0.9], sources: [novel ¶296, comic b1-p014-1]}
  - {who: vaidji, at: [2.9, 0.6], pose: sit, on: chair, face: [0.2, 0.6], sources: [novel ¶296, novel ¶299, comic b1-p014-1]}
  - {who: attendant, at: [-0.9, 1.6], pose: stand, face: [1.4, -2.3], sources: [novel ¶295, novel ¶296]}   # "the obsequious attendant", until he is sent out

beats:
  - id: the-tent
    sources: [comic b1-p014-1, breakdown ch9 p1, novel ¶294-298]
    do:
      - caption: "Later, in Mahant's tent."
      - caption: "Mahant looked at Dvij with his hawk-like eyes and said something in a dialect he did not understand. He seemed pleased to note that, and switched to one he did."
      - actor: {who: mahant, anim: wave-off}
      - say: {who: mahant, line: "Come, come. I have been expecting you. You may leave us.", sources: [novel ¶295]}
      - actor: {who: attendant, anim: bow, then: {walk: [0.6, 4.3], via: [[0.2, 2.9]], face: [0.6, 8]}}   # he quickly moves out, and keeps guard outside (novel ¶296)
      - actor: {who: mahant, anim: wipe-fingers}   # he had just had a paan, and wipes his soiled fingers (novel ¶298)
      - caption: "Mahant reclined across a divan, his torso bolstered up by a fattish masnad. Two men sat on chairs. A large sheet of paper lay over the table, with a large diagram and text written around it."
      - say: {who: mahant, line: "Does that smell bother you?", sources: [novel ¶297]}
      - caption: "He was kept standing, though there was an empty chair next to the divan. He chose not to reply this early in the conversation."

  - id: the-paan
    sources: [comic b1-p014-1, breakdown ch9 p2, novel ¶299-302]
    do:
      - caption: "The man with the rubicund face proffered him a paan, extending a tray full of them towards him."
      - actor: {who: vaidji, look: player, anim: offer}
      - actor: {who: baldev, anim: chew}         # he chews tobacco (breakdown ch2; the author, 21 Oct)
      - say: {who: baldev, line: "Go on, have one. It freshens the breath.", sources: [novel ¶300]}
      - say: {who: mahant, line: "Ah, the paan. It's nothing less than a holy alliance between the areca nut and the betel leaf. The areca nut represents the male and the betel leaf the female principle. But of course you would not know that. For you it is enough to know that it is inauspicious for a guest to not have one. So you must.", sources: [novel ¶301]}
    act:
      objective: Take a paan.
      kind: look-press
      target: [0.65, 0.5, -0.45]                 # the paan tray on the low table (temple-site.yaml)
    then:
      - caption: "He understood the message and partook in the ceremonial offering."
      - actor: {who: vaidji, anim: nod}

  - id: the-prophecy
    sources: [comic b1-p014-2, comic b1-p014-3, breakdown ch9 p3, novel ¶303-310]
    do:
      - actor: {who: mahant, anim: steeple}        # he sits upright, fingertips together (novel ¶298, comic b1-p014-4)
      - say: {who: mahant, line: "No doubt you know by now that I predicted your arrival in this valley, and that I predicted that you would arrive wounded.", sources: [novel ¶303]}
      - say: {who: dvij, line: "Yes I have.", sources: [novel ¶304]}
      - say: {who: mahant, line: "Then you know that the prediction has come true. I also predicted that you would have no past.", sources: [novel ¶305]}
    act:
      objective: Bow to him.
      kind: press
    then:
      - look: {at: down}
      - say: {who: dvij, line: "Yes. I know that that prediction has also come true, O wise one.", sources: [novel ¶306, novel ¶307]}
      - caption: "He detected a slight look of surprise in Mahant's eyes."
      - say: {who: mahant, line: "You do?", sources: [novel ¶308]}
      - say: {who: dvij, line: "Yes, O Mahant. Just like you predicted, I have lost my memory in the terrible accident. Without my memory I have no past. But of course you know everything.", sources: [novel ¶309]}
      - caption: "There was a glint of satisfaction in Mahant's eyes. Dvij had no doubt that Mahant had not known about his memory, but was immensely pleased to learn of it."

  - id: the-duties
    sources: [comic b1-p014-4, breakdown ch9 p4, novel ¶311-314]
    do:
      - say: {who: mahant, line: "Yes, of course I know. Do not worry. It is as per His divine plan. You were meant to have an accident and lose your memory. But it will all come back to you once you have fulfilled your duties for which He has sent you to the valley.", sources: [novel ¶311]}
      - say: {who: dvij, line: "What are these duties, O Mahant?", sources: [novel ¶312]}
      - say: {who: mahant, line: "The God has chosen you to be His instrument, and me to be the medium of instruction. As such you shall do everything I ask you to. For in my asking you will see the God Himself asking you. Your faith and your love will bring back your memories.", sources: [novel ¶313]}
    act:
      objective: Kneel.
      kind: press
    then:
      - camera: {pose: sit-low, over: 1.2}
      - caption: "Dvij nodded with as much humility as he could feign and settled down on folded legs. Mahant stood, smeared a tilak up his forehead and muttered some shlokas."
      - actor: {who: mahant, pose: stand, walk: [0.7, -0.2]}   # he stands from the divan (novel ¶314)
      - actor: {who: baldev, pose: stand}
      - actor: {who: vaidji, pose: stand}
      - actor: {who: mahant, face: player, anim: tilak}

  - id: the-saviour
    sources: [comic b1-p014-5, comic b1-p014-6, breakdown ch9 p5, breakdown ch9 p6, novel ¶315, novel ¶316]
    do:
      - actor: {who: mahant, anim: circle}         # "his hand drawing a large circle above them" (novel ¶315)
      - say: {who: mahant, line: "The peasants in this valley perish like rats, for their immoral ways have invoked the wrath of the Gods. You have been chosen to be their saviour, and you shall be so.", sources: [novel ¶315]}
    act:
      objective: Fall at his feet.
      kind: press
    then:
      - camera: {pose: floor, over: 1.2}
      - caption: "Mahant blessed him and asked him to rise."
      - actor: {who: mahant, anim: bless}          # his hand flat on Dvij's head (comic b1-p014-5)
      - camera: {pose: sit-low, over: 1.2}

  - id: the-name
    sources: [comic b1-p014-7, comic b1-p014-8, breakdown ch9 p7, breakdown ch9 p8, novel ¶317-319]
    do:
      - say: {who: mahant, line: "You have taken a new birth, and thus you shall have a new name. And that shall be...", sources: [novel ¶317]}
    act:
      objective: Name yourself.
      kind: press
    then:
      - say: {who: dvij, line: "Dvij, O holy one. Name me Dvij, the twice-born.", sources: [novel ¶318]}
      - actor: {who: mahant, anim: proclaim}       # (comic b1-p014-8)
      - say: {who: mahant, line: "Yes! Yes! That is what you shall be named from now onwards. Dvij it shall be! For in forgetting your past you have taken birth again. You are the twice-born. Come, follow me. It is the shubh muhurat for the consecration rite.", sources: [novel ¶319]}
      - camera: {pose: stand, over: 1.2}
      - checkpoint: named
      - actor: {who: mahant, walk: [1.6, 14.0], via: [[0.6, 3.2], [1.2, 9.0]], face: [0, 14], exit: false}   # he strides out to his seat east of the altar (novel ¶320, comic b1-p015-1)
      - actor: {who: baldev, walk: [3.2, 15.6], via: [[-0.4, 3.2], [2.4, 9.0]], face: [0, 14]}
      - actor: {who: vaidji, walk: [3.4, 13.0], via: [[0.8, 3.4], [3.0, 9.0]], face: [0, 14]}

  - id: the-altar
    sources: [comic b1-p015-1, breakdown ch9 p9, novel ¶320, novel ¶321]
    act:
      objective: Follow Mahant out to the altar.
      kind: reach
      target: [1.6, 11.2]
      radius: 2.0
    then:
      - caption: "By now many of the volunteers had returned. An altar had been set with a fire already burning. A totem rose at its side, made of five kinds of leaves."
      - say: {who: mahant, line: "Come, sit by my side. Let the people see you sitting with me.", sources: [novel ¶321]}
      - actor: {who: mahant, pose: kneel, anim: beckon}   # (comic b1-p015-2: seated, he beckons)

  - id: the-seat
    sources: [comic b1-p015-2, comic b1-p015-3, novel ¶320]
    act:
      objective: Sit at his right side.
      kind: look-press
      target: [1.6, 0.1, 12.7]                   # the seat to the right of Mahant's, east of the altar
    then:
      - camera: {pose: sit-low, at: [1.6, 12.7], look: [0, 0.8, 14], over: 1.5}
      - caption: "It was a small ritual, a dry run before the much more elaborate garbhadhanam, and a test for Dvij."

  - id: the-rite
    sources: [comic b1-p015-4, comic b1-p015-5, breakdown ch9 p10, novel ¶322]
    act:
      objective: Offer the ghee to the fire.
      kind: look-press
      target: [0, 0.9, 14]
    then:
      - sound: hiss
      - effect: {glare: 0.35, over: 0.4}
      - effect: {glare: 0, over: 1.5}
      - say: {who: dvij, line: "Om agnimile purohitam, yajnasya devam ritvijam, hotaram ratnadhatamam. Svaha... svaha...", sources: [comic b1-p015-4]}
      - caption: "He faithfully followed all orders given by Mahant, reciting the complex mantras with him and offering the right ahutis at the right junctures. By the end, Mahant was immensely pleased with how he had conducted himself."
      - actor: {who: mahant, anim: nod}

  - id: dismissed
    sources: [comic b1-p015-7, comic b1-p015-8, breakdown ch9 p11, novel ¶323]
    act:
      objective: Kneel for his blessing.
      kind: press
    then:
      - look: {at: down}
      - actor: {who: mahant, anim: bless}          # his hand on Dvij's bowed head (comic b1-p015-8)
      - say: {who: mahant, line: "Now go and wait till I give the word to come back, on the night when the new moon will dawn.", sources: [novel ¶323]}
      - camera: {pose: stand, over: 1.2}
      - checkpoint: dismissed

  - id: the-plain
    sources: [comic b1-p015-9, comic b1-p015-10, breakdown ch9 p15, novel ¶324]
    act:
      objective: Walk away across the site.
      kind: reach
      target: [-34, 40]                          # towards the bridge and the tavern (novel ¶326)
      radius: 4.0
    then:
      - caption: "Dvij walked across the large barren tract of land, feeling satisfied with his own glib performance."
      - caption: "Soon his thoughts turned back to his missing past, which lay somewhere beyond the tall mountains that encircled this unknown valley."
      - progress: {book: 1, page: 15}
      - end: {next: null}
