# The temple site: Mahant's pandaal beside the proposed temple, and the fire altar (design §10.3).
# Built by pipeline/build_site.py with blender/build_site.py, from the novel and the comic's
# own drawings of it; anything neither shows is marked `ours`.
#
# Frame: metres, x east, y up, z south, origin at the middle of the tent's floor, ground at y 0.
#
# The novel:  ¶224  "the temple site from the shade of the temporary pandal ... Out in the large
#                   open space ... volunteers from the village digging up artefacts deemed
#                   impure ... beyond it lay a considerable stretch of fertile agricultural land"
#             ¶296  "the covered pandaal set up adjacent to the temple construction site ...
#                   Mahant was reclined leisurely across a divan, his torso bolstered up by a
#                   fattish masnad. Two men ... were sitting on chairs. A large sheet of paper lay
#                   over a table, with a large diagram and text written around it"
#             ¶298  "kept standing even though there was an empty chair next to the divan"
#             ¶320  "An altar had been set with a fire already burning. A totem rose at its side,
#                   appeared to be made of five kinds of leaves ... Mahant took his place at the
#                   east of the altar ... Dvij was seated to his right side"
#             ¶324, ¶326  he "walked across the large barren track of land", "the desert-like sands
#                   of the site of the proposed temple and crossed a creaking bridge over a mostly
#                   dried riverbed" to the tavern at the crossroads
# The comic:  b1-p011-4 (the tent on the stony field, curtains tied back, Mahant on his divan inside),
#             b1-p011-5..10 (inside: bolsters, a carpet, the liquor chest), b1-p014-1 (inside: the
#             divan, Baldev's chair, the low table with the diagram, bottle and glasses, a paan
#             plate, Vaidji's chair), b1-p014-5 (a Sanskrit verse hanging on the tent wall, a lamp
#             on a side table, a cabinet), b1-p015-1 (outside: the verse painted on the tent's
#             valance, saffron flags on the roof, the square altar with a white zigzag border, the
#             fire, the leaf totem on a pole, fruit and flowers, brass pots, villagers on durries),
#             b1-p015-10 (the tent small at the left of a barren plain, the mountains ahead).

where:
  # The book's map does not mark it. The novel has Dvij leave it, cross the bridge over the
  # dried riverbed and reach the tavern (¶326), so it lies between the lodge and the tavern,
  # east of the river. A point on the map image (0-1 across, 0-1 down), and which way the
  # tent's entrance faces.
  map: [0.555, 0.615]
  facing: s
  sources: [novel ¶326, ours]

ground:
  pad: [-40, -30, 40, 45]           # the levelled, dug-over site around the tent and the altar (ours)
  sources: [novel ¶224, novel ¶324, comic b1-p011-4, comic b1-p015-10]

tent:
  size: [9.0, 7.0]                   # x by z: ours, from the comic's proportions (b1-p011-4)
  wall: 2.8                          # the height of its sides
  peak: 5.6                          # the ridge of its canopy: tall and pointed, as the comic draws it
  door: {width: 3.2}                 # the front, its curtains tied back (b1-p011-4)
  flags: 2                           # saffron pennants on the roof (b1-p015-1)
  sources: [novel ¶224, novel ¶296, comic b1-p011-4, comic b1-p015-1]

inside:
  - {id: carpet, kind: carpet, rect: [-4.3, -3.3, 4.3, 3.3], sources: [comic b1-p011-5, comic b1-p014-1]}
  - {id: divan, kind: divan, at: [1.6, -2.3], size: [2.2, 1.0], sources: [novel ¶296, comic b1-p011-5, comic b1-p014-1]}
  - {id: masnad, kind: bolster, at: [0.7, -2.3], sources: [novel ¶296, comic b1-p011-5]}
  - {id: empty-chair, kind: chair, at: [-0.2, -2.4], face: s, sources: [novel ¶298]}
  - {id: baldev-chair, kind: chair, at: [-2.6, -0.9], face: e, sources: [novel ¶296, comic b1-p014-1]}
  - {id: vaidji-chair, kind: chair, at: [2.9, 0.6], face: w, sources: [novel ¶296, comic b1-p014-1]}
  - {id: low-table, kind: low-table, at: [0.2, -0.6], size: [1.5, 0.8], sources: [novel ¶296, comic b1-p014-1]}
  - {id: diagram, kind: diagram, at: [0.1, -0.6], sources: [novel ¶296, comic b1-p014-1]}
  - {id: paan-tray, kind: paan-tray, at: [0.65, -0.45], sources: [novel ¶299, comic b1-p014-1]}
  - {id: bottle, kind: bottle, at: [-0.3, -0.75], sources: [comic b1-p011-6, comic b1-p014-1]}
  - {id: chest, kind: chest, at: [3.4, -2.6], sources: [novel ¶228, comic b1-p011-6]}
  - {id: lamp-table, kind: lamp-table, at: [-1.6, -2.7], sources: [comic b1-p014-5, comic b1-p015-8]}
  - {id: cabinet, kind: cabinet, at: [-3.6, -2.6], sources: [comic b1-p014-5]}
  - {id: vase-left, kind: marigolds, at: [-4.0, -3.0], sources: [comic b1-p014-1, comic b1-p014-3]}
  - {id: vase-right, kind: marigolds, at: [4.0, -3.0], sources: [comic b1-p014-1, comic b1-p014-3]}
  - {id: verse, kind: verse, wall: n, at: -1.8, sources: [comic b1-p014-5]}   # the comic's own lettering, cropped from the page

outside:
  - {id: altar, kind: altar, at: [0, 14], size: 1.3, sources: [novel ¶320, comic b1-p015-1, comic b1-p015-5]}
  - {id: totem, kind: totem, at: [-1.2, 13.2], sources: [novel ¶320, comic b1-p015-1]}
  - {id: sapling, kind: tree, at: [3.5, 11.5], sources: [comic b1-p015-1]}
  - {id: offerings, kind: offerings, at: [-1.0, 15.2], sources: [comic b1-p015-1, comic b1-p015-5]}
  - {id: mahant-seat, kind: seat, at: [1.6, 14], face: w, sources: [novel ¶320]}      # "at the east of the altar"
  - {id: dvij-seat, kind: seat, at: [1.6, 12.7], face: w, sources: [novel ¶320, novel ¶321, comic b1-p015-3]}   # "to his right side"
  - {id: durrie-west, kind: durrie, rect: [-9, 10, -4, 18], sources: [comic b1-p015-1]}    # where the villagers sit
  - {id: durrie-south, kind: durrie, rect: [-3, 19, 5, 23], sources: [comic b1-p015-1]}
  - {id: flag-poles, kind: flags, points: [[-6, 6], [6, 6], [-8, 22], [8, 22]], sources: [comic b1-p015-1]}
  - {id: spoil, kind: heaps, count: 26, rect: [-38, -28, 38, 43], keep_clear: [[-6, -6, 14, 26]], sources: [novel ¶224, comic b1-p011-4]}   # the dug-over field, heaps of stones and bones taken out

markers:
  - {id: arrive, at: [0, 30], heading: 0, label: The temple site}   # facing north, at the tent
  - {id: dvij-stand, at: [0.2, 0.9]}    # where he is kept standing, before the divan (novel ¶298)
  - {id: way-out, at: [-34, 40]}        # towards the bridge and the tavern (novel ¶324, ¶326)
